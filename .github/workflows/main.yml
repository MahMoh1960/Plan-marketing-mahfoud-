name: Compiler l'APK

# Ce fichier se colle dans GitHub : Actions > "New workflow" > "set up a workflow yourself".
# Il construit l'APK à partir des fichiers de la racine du dépôt, sans aucun dossier à créer.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Générer le projet Android (Capacitor)
        run: |
          set -e
          mkdir -p www
          cp index.html style.css app.js manifest.json sw.js icon-192.png icon-512.png www/
          echo '{"name":"plan-marketing","version":"1.0.0","private":true}' > package.json
          npm install --no-audit --no-fund \
            @capacitor/core@8.5.3 @capacitor/cli@8.5.3 @capacitor/android@8.5.3 \
            @capacitor/filesystem@8.1.5 @capacitor/share@8.0.3
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.planmarketing.app",
            "appName": "Plan marketing",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Installer la plateforme Android requise
        run: |
          set -e
          SDK=$(grep -oP 'compileSdkVersion = \K[0-9]+' android/variables.gradle)
          echo "Plateforme Android requise : $SDK"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$SDK"

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: plan-marketing-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
